  /* ------------------------------------------------------------------ 导出 / 导入 / 引导 */
  function doExport() {
    var payload = {
      schema: SCHEMA,
      version: WB.version,
      exportedAt: new Date().toISOString(),
      evidence: WB.evidence,
      state: WB.state,
      quizAnswers: WB.quizAnswers
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qinglan-qa-archive-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('已导出学习与过关档案 JSON');
  }

  function doImportFile(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var obj = JSON.parse(String(rd.result || ''));
        if (!obj || typeof obj !== 'object' || obj.schema !== SCHEMA) {
          toast('导入被拒绝：不是本平台合法档案格式', 'fail');
          return;
        }
        if (obj.evidence) WB.evidence = obj.evidence;
        if (obj.state) WB.state = obj.state;
        if (obj.quizAnswers) WB.quizAnswers = obj.quizAnswers;
        saveStore();
        render();
        toast('档案导入成功！');
      } catch (e) {
        toast('导入失败：JSON 文件格式不对', 'fail');
      }
    };
    rd.readAsText(file);
  }

  function openGuide() {
    var overlay = document.getElementById('guide-overlay');
    if (!overlay) return;
    var step = 0;
    var steps = [
      {
        t: '① 像玩游戏一样点开任意一关',
        b: '页面顶部 1~8 号胶囊就是 8 个独立小游戏。不用先背定义，直接点进你想玩的一关，点亮卡片、扫一扫代码或踩踩边界！'
      },
      {
        t: '② 看懂底部「大白话教练气泡」',
        b: '每当你点了一个按钮或改了开关，下方卡通气泡都会用最直白的话告诉你：为什么报错、哪里会漏虫。需要细调才点「高级调节」。'
      },
      {
        t: '③ 攒齐档案，通关随堂挑战',
        b: '玩出满意结果时点右上角「📌 记为过关档案」，第 8 关「发布门禁」会自动收集前 7 关战果帮你拍板能不能发布！'
      }
    ];
    function paint() {
      var cur = steps[step];
      var bars = steps.map(function (_, i) { return '<i' + (i <= step ? ' class="on"' : '') + '></i>'; }).join('');
      overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-h"><h2>' + Q.esc(cur.t) + '</h2></div>' +
        '<div class="modal-b"><div class="guide-steps">' + bars + '</div><p>' + Q.esc(cur.b) + '</p></div>' +
        '<div class="modal-f">' +
          '<button type="button" class="btn ghost" data-g="close">跳过</button>' +
          (step > 0 ? '<button type="button" class="btn" data-g="prev">上一步</button>' : '') +
          '<button type="button" class="btn primary" data-g="' + (step < steps.length - 1 ? 'next' : 'close') + '">' +
            (step < steps.length - 1 ? '下一步 →' : '开始玩！') +
          '</button>' +
        '</div></div>';
      overlay.hidden = false;
    }
    overlay.onclick = function (ev) {
      var btn = ev.target.closest('[data-g]');
      if (!btn && ev.target !== overlay) return;
      var g = btn ? btn.getAttribute('data-g') : 'close';
      if (g === 'next') { step++; paint(); }
      else if (g === 'prev') { step--; paint(); }
      else { overlay.hidden = true; WB.session.guideSeen = true; }
    };
    paint();
  }

  /* ------------------------------------------------------------------ 全局事件委派 */
  function wireGlobalEvents() {
    document.addEventListener('click', function (ev) {
      var navEl = ev.target.closest('[data-nav]');
      if (navEl) {
        go(navEl.getAttribute('data-nav'));
        return;
      }
      var pbtn = ev.target.closest('button[data-p]');
      if (pbtn) {
        var rr = parseHash();
        if (rr.view === 'exp' && WB.byId[rr.id]) {
          var k = pbtn.getAttribute('data-p');
          var v = pbtn.getAttribute('data-v');
          Array.prototype.forEach.call(pbtn.parentElement.querySelectorAll('button[data-p]'), function (b) {
            b.classList.toggle('on', b === pbtn);
          });
          applyExpParam(WB.byId[rr.id], k, v, pbtn);
          return;
        }
      }
      var actEl = ev.target.closest('[data-act]');
      if (!actEl) return;
      var act = actEl.getAttribute('data-act');

      if (act === 'help') { openGuide(); return; }
      if (act === 'export-all') { doExport(); return; }
      if (act === 'import-all') {
        var inp = document.getElementById('import-file');
        if (inp) { inp.value = ''; inp.click(); }
        return;
      }
      if (act === 'clear-all') {
        WB.evidence = {}; WB.state = {}; WB.quizAnswers = {}; WB.quizDrafts = {};
        saveStore();
        render();
        toast('已重置所有关卡与答题记录');
        return;
      }

      /* 实验页头按钮 */
      var r = parseHash();
      if (r.view === 'exp' && WB.byId[r.id]) {
        var exp = WB.byId[r.id];
        if (act === 'exp-tab') {
          WB.session.tab[exp.id] = actEl.getAttribute('data-t') || 'lab';
          renderExpPage(exp.id);
          return;
        }
        if (act === 'record-evidence') {
          var st = ensureState(exp);
          var res = exp.compute(st, WB);
          var evData = exp.evidence(res, st, WB);
          WB.evidence[exp.id] = evData;
          saveStore();
          renderExpPage(exp.id);
          refreshNav();
          toast('已记录第 ' + exp.no + ' 关过关档案：' + (evData.pass ? '达标' : '已存档'));
          return;
        }
        if (act === 'reset-exp') {
          WB.state[exp.id] = clone(exp.defaults || {});
          saveStore();
          renderExpPage(exp.id);
          toast('已恢复第 ' + exp.no + ' 关默认状态');
          return;
        }
      }

      /* 随堂测试交互 */
      if (act === 'quiz-pick') {
        var qid = actEl.getAttribute('data-qid');
        WB.quizAnswers[qid] = parseInt(actEl.getAttribute('data-opt'), 10);
        saveStore();
        rerenderQuizHost(r);
        return;
      }
      if (act === 'quiz-toggle') {
        var mqid = actEl.getAttribute('data-qid');
        var optIdx = parseInt(actEl.getAttribute('data-opt'), 10);
        var cur = Array.isArray(WB.quizDrafts[mqid]) ? WB.quizDrafts[mqid].slice() : [];
        var idx = cur.indexOf(optIdx);
        if (idx >= 0) cur.splice(idx, 1); else cur.push(optIdx);
        WB.quizDrafts[mqid] = cur;
        rerenderQuizHost(r);
        return;
      }
      if (act === 'quiz-submit-multi') {
        var sqid = actEl.getAttribute('data-qid');
        var d = WB.quizDrafts[sqid] || [];
        if (d.length) {
          WB.quizAnswers[sqid] = d.slice().sort(function (a, b) { return a - b; });
          delete WB.quizDrafts[sqid];
          saveStore();
          rerenderQuizHost(r);
        }
        return;
      }
      if (act === 'quiz-submit-fill') {
        var fqid = actEl.getAttribute('data-qid');
        var finp = document.querySelector('[data-q-fill="' + fqid + '"]');
        var rawVal = finp ? finp.value.trim() : (WB.quizDrafts[fqid] || '').trim();
        if (!rawVal) { toast('先填一个关键词或数字再提交吧', 'warn'); return; }
        WB.quizAnswers[fqid] = rawVal;
        delete WB.quizDrafts[fqid];
        saveStore();
        rerenderQuizHost(r);
        return;
      }
      if (act === 'quiz-clear') {
        var cqid = actEl.getAttribute('data-qid');
        delete WB.quizAnswers[cqid];
        delete WB.quizDrafts[cqid];
        saveStore();
        rerenderQuizHost(r);
        return;
      }
      if (act === 'quiz-clear-exp') {
        var eid = actEl.getAttribute('data-eid');
        Q.quizByExp(eid).forEach(function (q) {
          delete WB.quizAnswers[q.id]; delete WB.quizDrafts[q.id];
        });
        saveStore();
        rerenderQuizHost(r);
        toast('已清空本关随堂小题作答记录');
        return;
      }
      if (act === 'quiz-filter') {
        var fk = actEl.getAttribute('data-fk');
        var fv = actEl.getAttribute('data-fv');
        if (fk === 'wrongOnly') WB.quizFilter.wrongOnly = !WB.quizFilter.wrongOnly;
        else WB.quizFilter[fk] = fv;
        renderQuizPage();
        return;
      }
      if (act === 'quiz-reset') {
        WB.quizAnswers = {}; WB.quizDrafts = {};
        saveStore();
        renderQuizPage();
        refreshNav();
        toast('已清空随堂挑战作答记录');
        return;
      }

      if (r.view === 'exp' && WB.byId[r.id] && WB.byId[r.id].onAction) {
        var curExp = WB.byId[r.id];
        var curSt = ensureState(curExp);
        var actRes = curExp.onAction(act, actEl, curSt, WB, function (rebuildAll) {
          saveStore();
          updateExpStage(curExp, Boolean(rebuildAll));
        });
        if (actRes === 'sync-ctrl' || actEl.closest('#exp-ctrl-host')) {
          saveStore();
          updateExpStage(curExp, true);
        } else if (actRes === true) {
          saveStore();
          updateExpStage(curExp, false);
        }
      }
    });

    document.addEventListener('input', function (ev) {
      var finp = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-q-fill');
      if (finp) { WB.quizDrafts[finp] = ev.target.value; return; }
      var t = ev.target;
      if (t && t.getAttribute && t.getAttribute('data-p') !== null) {
        var r = parseHash();
        if (r.view === 'exp' && WB.byId[r.id] && (t.type === 'range' || t.type === 'text' || t.type === 'number')) {
          var val = (t.type === 'range' || t.type === 'number') ? Number(t.value) : t.value;
          applyExpParam(WB.byId[r.id], t.getAttribute('data-p'), val, t);
        }
      }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && ev.target && ev.target.getAttribute && ev.target.getAttribute('data-q-fill')) {
        var qid = ev.target.getAttribute('data-q-fill');
        var btn = document.querySelector('[data-act="quiz-submit-fill"][data-qid="' + qid + '"]');
        if (btn) btn.click();
      }
    });

    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (t && t.id === 'import-file' && t.files && t.files[0]) {
        doImportFile(t.files[0]);
        return;
      }
      if (t && t.getAttribute && t.getAttribute('data-p') !== null) {
        var r = parseHash();
        if (r.view === 'exp' && WB.byId[r.id]) {
          var exp = WB.byId[r.id];
          var k = t.getAttribute('data-p');
          if (t.type === 'checkbox' && t.getAttribute('data-multi')) {
            var st = ensureState(exp);
            var arr = Array.isArray(st[k]) ? st[k].slice() : [];
            if (t.checked) { if (arr.indexOf(t.value) < 0) arr.push(t.value); }
            else arr = arr.filter(function (x) { return x !== t.value; });
            applyExpParam(exp, k, arr, t);
          } else if (t.type === 'checkbox') {
            applyExpParam(exp, k, Boolean(t.checked), t);
          } else if (t.tagName === 'SELECT') {
            applyExpParam(exp, k, t.value, t);
          }
        }
      }
    });
  }

  function rerenderQuizHost(route) {
    refreshNav();
    if (route.view === 'quiz') renderQuizPage();
    else if (route.view === 'exp' && route.id) renderExpPage(route.id);
  }

  /* ------------------------------------------------------------------ 总渲染 & 启动 */
  function render() {
    clearAnim();
    var r = parseHash();
    refreshNav();
    if (r.view === 'overview') renderOverview();
    else if (r.view === 'graph') renderGraphPage();
    else if (r.view === 'quiz') renderQuizPage();
    else if (r.view === 'evidence') renderEvidencePage();
    else if (r.view === 'about') renderAboutPage();
    else if (r.view === 'exp') renderExpPage(r.id);
    refreshNav();
  }

  function boot() {
    loadStore();
    var app = document.getElementById('app');
    app.innerHTML = '<div class="app-wrap">' +
      buildHeader() +
      buildTopTabs() +
      '<main class="stage"><div id="view" class="view"></div></main>' +
    '</div>' +
    '<div id="guide-overlay" class="overlay" hidden></div>' +
    '<div id="toast-host" aria-live="polite"></div>';

    wireGlobalEvents();
    window.addEventListener('hashchange', render);
    render();
    if (WB.session.memOnly) toast('浏览器禁止了本地存储，已自动切换为内存临时模式', 'warn');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

/* ============================================================================
 * m1.js — 第 1 关：静态代码抓茬游乐场
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  var TYPE_LABEL = {};
  Q.SR_DEFECT_TYPES.forEach(function (t) { TYPE_LABEL[t.key] = t.label; });
  var SEV_LABEL = { trivial: '轻微', minor: '一般', major: '严重', fatal: '致命' };
  var SEV_BADGE = { trivial: 'mute', minor: 'warn', major: 'fail', fatal: 'fail' };

  function makeDefaults() {
    return {
      version: 'v1.0',
      scope: 'all',
      severityThreshold: 'trivial',
      activeType: 'validation',
      marks: {},
      rules: Q.SR_RULES.map(function (r) { return r.id; }),
      revealed: false,
      scanning: false
    };
  }

  function buildParams(st) {
    return [
      {
        key: 'version', label: '选一份代码剧本', type: 'pills',
        options: [
          { v: 'v1.0', l: '📄 初版 v1.0（虫子多）' },
          { v: 'v1.1', l: '🔧 修复版 v1.1' }
        ]
      },
      {
        key: 'activeType', label: '点代码行贴的标签', type: 'select',
        options: Q.SR_DEFECT_TYPES.map(function (t) { return { v: t.key, l: t.label }; })
      },
      { type: 'action', action: 'rule-scan', label: '🔍 一键自动扫雷', variant: 'primary' },
      { type: 'action', action: 'reveal-all', label: st.revealed ? '🙈 收起答案' : '💡 揭晓全部真Bug', variant: 'fun' },
      { type: 'action', action: 'clear-marks', label: '🧹 清空标记', variant: '' },
      { key: 'scope', label: '只看哪一段', type: 'select', advanced: true, options: Q.SR_SCOPES.map(function (s) { return { v: s.key, l: s.label }; }) },
      {
        key: 'severityThreshold', label: '门禁拦截严格度', type: 'select', advanced: true,
        options: [
          { v: 'trivial', l: '轻微以上全算（0容忍）' },
          { v: 'minor', l: '一般以上' },
          { v: 'major', l: '只拦严重/致命' },
          { v: 'fatal', l: '只拦致命' }
        ]
      },
      {
        key: 'rules', label: '自动扫雷工具规则开关', type: 'checks', advanced: true,
        options: Q.SR_RULES.map(function (r) { return { v: r.id, l: r.id + ' ' + r.title, sub: r.note }; })
      }
    ];
  }

  function compute(st) {
    var review = Q.srReview(st.version, st.marks, { scope: st.scope, severityThreshold: st.severityThreshold });
    var lines = Q.SR_CODE[st.version] || [];
    var scan = Q.srRuleScan(st.version, st.rules);
    return { review: review, lines: lines, scan: scan, threshold: st.severityThreshold, revealed: st.revealed };
  }

  function viz(res, st) {
    var r = res.review;
    var base = Q.SR_BASELINE[st.version] || [];
    var baseByLine = {};
    base.forEach(function (d) { d.lines.forEach(function (ln) { baseByLine[ln] = d; }); });

    var kpis = Q.kpiStrip([
      { icon: '🐛', label: '已揪出真 Bug', value: r.detected.length + ' / ' + r.totalInScope, sub: '点击下面可疑代码行捉虫', tone: r.detected.length >= r.totalInScope ? 'ok' : 'blue' },
      { icon: '🎯', label: '抓虫命中率', value: Q.pctText(r.metrics.detectionRate), sub: '自动工具+人工复查配合', tone: 'teal' },
      { icon: '😅', label: '误伤好代码', value: r.falsePositives.length + ' 处', sub: '乱标会被工具提示', tone: r.falsePositives.length ? 'warn' : 'ok' },
      { icon: '🚦', label: '静态放行判定', value: r.gateOk ? '已过关' : '未过关', sub: r.gateOk ? '门禁内漏洞已清空' : '还漏 ' + r.remaining.length + ' 只必抓虫', tone: r.gateOk ? 'ok' : 'bad' }
    ]);

    var codeRows = res.lines.map(function (tx, idx) {
      var ln = idx + 1;
      var inSc = Q.srInScope(st.scope, ln);
      var mk = st.marks[ln];
      var realD = baseByLine[ln];
      var missedShown = st.revealed && realD && !mk && inSc;
      var cls = 'code-line' + (inSc ? ' clk' : ' dimline') + (mk ? ' mark' : '') + (missedShown ? ' missed' : '');
      var tag = '';
      if (mk && realD) tag = '<span class="bug-wiggle">🐛</span><span class="cl-tag">✅ 抓到了 · ' + Q.esc(TYPE_LABEL[mk] || mk) + '</span>';
      else if (mk) tag = '<span class="cl-badge">' + Q.esc(TYPE_LABEL[mk] || mk) + '（好代码误报）</span>';
      else if (missedShown) tag = '<span class="cl-tag-miss">🚨 漏网真虫 · ' + Q.esc(realD.title) + '</span>';

      return '<div class="' + cls + '" data-act="toggle-mark" data-line="' + ln + '">' +
        '<span class="cl-no">' + ln + '</span>' +
        '<span class="cl-tx">' + Q.esc(tx || ' ') + '</span>' + tag +
      '</div>';
    }).join('');

    var codeCard = '<div class="card code-scan-wrap">' +
      (st.scanning ? '<div class="scan-beam"></div>' : '') +
      '<div class="card-h">' +
        '<div><span class="card-t">📄 被审查代码：bookingService.js (' + Q.esc(st.version) + ')</span> ' +
        '<span class="card-sub">直接点击代码行就能标出 Bug / 再点一次取消</span></div>' +
        '<span class="badge mute">当前标签：' + Q.esc(TYPE_LABEL[st.activeType] || st.activeType) + '</span>' +
      '</div>' +
      '<div class="codeview">' + codeRows + '</div>' +
    '</div>';

    var coachBox = '';
    if (r.empty) {
      coachBox = Q.coach('info', '先点一下「🔍 一键自动扫雷」试试看！',
        '不用一行行干瞪眼！点按钮让机器扫描器先跑一遍，它会亮出<b>表面明显不对劲的地方</b>；但它抓不到“业务写反、吞掉报错”这类藏得深的逻辑虫，需要你接着点代码行补齐。');
    } else if (r.gateOk) {
      coachBox = Q.coach('ok', '漂亮！这轮静态评审全部抓齐了',
        '你一共标了 <b>' + r.markedCount + '</b> 处，命中全部 <b>' + r.totalInScope + '</b> 个关键隐患（误报 ' + r.falsePositives.length + ' 处）。记住：静态审查不用运行程序，就能省掉大量返工！');
    } else {
      coachBox = Q.coach('warn', '机器扫完了，但还有 ' + r.remaining.length + ' 只深层逻辑 Bug 藏在代码里！',
        '工具只会按字面规则找（比如 <code>console.log</code>、硬编码数字），像 <code>catch (e) {}</code> 吞报错、<code>order.data</code> 没判空这种语义问题机器看不懂。点「💡 揭晓全部真Bug」或自己点可疑行揪出来！');
    }

    var detailRows = [];
    r.detected.forEach(function (d) {
      detailRows.push([
        { html: Q.badge('pass', '✅ 已抓获') },
        '第 ' + d.line + ' 行',
        d.title,
        { html: Q.badge(SEV_BADGE[d.severity], SEV_LABEL[d.severity]) },
        d.typeOk ? '标签全对' : '位置对'
      ]);
    });
    (st.revealed ? r.missed : []).forEach(function (d) {
      detailRows.push([
        { html: Q.badge('fail', '🚨 漏网') },
        '第 ' + d.lines.join('/') + ' 行',
        d.title,
        { html: Q.badge(SEV_BADGE[d.severity], SEV_LABEL[d.severity]) },
        d.desc
      ]);
    });
    r.falsePositives.forEach(function (fp) {
      detailRows.push([
        { html: Q.badge('warn', '😅 误报') },
        '第 ' + fp.line + ' 行',
        '本行无缺陷',
        '—',
        '自动规则太敏感触发了假警报'
      ]);
    });
    var detailHtml = detailRows.length
      ? Q.table(['状态', '位置', '问题名称', '等级', '大白话说明'], detailRows)
      : Q.empty('还没有任何标记，点击代码行或点「一键自动扫雷」试试吧', '🔍');

    return kpis + codeCard + coachBox +
      Q.drawer('📋 抓虫结果明细单（含误报与漏网说明）', detailRows.length + ' 条记录', detailHtml, false);
  }

  function onAction(act, el, st, WB, update) {
    if (act === 'toggle-mark') {
      var ln = Number(el.getAttribute('data-line'));
      if (!Q.srInScope(st.scope, ln)) { WB.toast('该行不在当前筛选范围内', 'warn'); return; }
      if (st.marks[ln]) delete st.marks[ln];
      else st.marks[ln] = st.activeType || 'validation';
      return true;
    }
    if (act === 'rule-scan') {
      var scan = Q.srRuleScan(st.version, st.rules);
      Object.keys(scan.marks).forEach(function (k) {
        var ln = Number(k);
        if (Q.srInScope(st.scope, ln) && !st.marks[ln]) st.marks[ln] = scan.marks[ln];
      });
      st.scanning = true;
      update(false);
      setTimeout(function () {
        st.scanning = false;
        if (window.location.hash.indexOf('exp/m1') >= 0) update(false);
      }, 1150);
      WB.toast('自动扫雷已标出 ' + scan.count + ' 处疑似点！');
      return;
    }
    if (act === 'reveal-all') {
      st.revealed = !st.revealed;
      return 'sync-ctrl';
    }
    if (act === 'clear-marks') {
      st.marks = {};
      st.revealed = false;
      return 'sync-ctrl';
    }
  }

  function evidence(res) {
    var r = res.review;
    var mapId = { D1: 'STATIC_D1', D2: 'STATIC_D2', D3: 'STATIC_D3', D4: 'STATIC_D4', D5: 'STATIC_D5', D6: 'STATIC_D6', D7: 'STATIC_D7' };
    var foundIds = r.detected.map(function (d) { return mapId[d.id]; }).filter(Boolean);
    return {
      status: r.gateOk ? 'pass' : (r.detected.length ? 'warn' : 'fail'),
      pass: r.gateOk,
      coverage: r.metrics.detectionRate == null ? 0 : r.metrics.detectionRate,
      label: '缺陷检出率',
      defects: foundIds,
      summary: '抓到 ' + r.detected.length + '/' + r.totalInScope + ' 只虫（命中率 ' + Q.pctText(r.metrics.detectionRate) + '）',
      metrics: { detectionRate: r.metrics.detectionRate, marked: r.markedCount }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢静态找茬',
      '<b>代码都不用跑</b>，靠人眼走查 + 自动扫雷工具，就能提前把低级拼写错、敏感信息泄露、明显空指针干掉。记住：<b>工具只能帮抓表面规范，逻辑对不对还得靠人或测试用例验证！</b>');
  }

  window.WB.registerExp({
    id: 'm1', no: 1, group: '静态审查与基础',
    title: '静态找茬 · 代码扫雷', chapter: '第 6 章 · 静态测试与代码审查',
    hook: '不运行代码，也能靠扫描+肉眼把隐藏 Bug 揪出来',
    goal: ['体会“自动扫雷工具能抓多少、漏多少”', '分清表面报错和深层业务逻辑漏洞'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

/* ============================================================================
 * m2.js — 第 2 关：等价类划分（投篮分区游乐场）
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  var SAMPLE_BALLS = [
    { label: '✅ 正常代表 · 11课时 1人', input: { hours: 11, seats: 1, coupon: 0, type: 'new', hasCert: true } },
    { label: '🚧 下越界 · 0课时', input: { hours: 0, seats: 1, coupon: 0, type: 'new', hasCert: true } },
    { label: '🔴 非整数 · 3.5课时', input: { hours: 3.5, seats: 1, coupon: 0, type: 'new', hasCert: true } },
    { label: '⚠️ 2人团体边界（D1陷阱）', input: { hours: 11, seats: 2, coupon: 0, type: 'new', hasCert: true } },
    { label: '💸 减200元券减成负数（D3陷阱）', input: { hours: 1, seats: 1, coupon: 500, type: 'new', hasCert: true } },
    { label: '⚡ 3人+复训叠算（D4组合坑）', input: { hours: 11, seats: 3, coupon: 0, type: 'retrain', hasCert: true } }
  ];

  var DEFECT_PLAIN = {
    SEAT_BOUNDARY: 'D1 · 2人错打团体95折',
    ROUND_DOWN: 'D2 · 折后零头少算1元',
    COUPON_CAP: 'D3 · 优惠券倒贴变负数',
    RETRAIN_STACK: 'D4 · 团体与复训折上折'
  };

  function makeDefaults() {
    return {
      field: 'hours',
      level: 'standard',
      strategy: 'mid',
      includeInvalid: true,
      defects: ['SEAT_BOUNDARY', 'ROUND_DOWN', 'COUPON_CAP', 'RETRAIN_STACK'],
      customCases: [],
      lastBall: null,
      ballSeq: 0
    };
  }

  function buildParams() {
    return [
      {
        key: 'field', label: '先分哪个输入框的“组”', type: 'pills',
        options: [
          { v: 'hours', l: '⏱️ 培训课时 (1~120)' },
          { v: 'seats', l: '👥 报名人数 (1~20)' },
          { v: 'coupon', l: '🎟️ 优惠券 (0~500)' }
        ]
      },
      {
        key: 'strategy', label: '每组选谁当代表', type: 'pills',
        options: [
          { v: 'mid', l: '🎯 挑中间数' },
          { v: 'boundary', l: '🚧 顺手卡边' }
        ]
      },
      { type: 'action', action: 'combo-preset', label: '⚡ 一键试组合坑 (D4)', variant: 'primary' },
      { key: 'level', label: '分组粗细', type: 'select', advanced: true, options: [{ v: 'coarse', l: '粗分（只分有效/无效）' }, { v: 'standard', l: '标准分组（推荐）' }, { v: 'fine', l: '细分拆小块' }] },
      { key: 'includeInvalid', label: '包含非法/越界小组', type: 'checkbox', advanced: true, hint: '关掉就会漏测乱填的情况' },
      {
        key: 'defects', label: '系统里暗藏的 4 个 Bug', type: 'checks', advanced: true,
        options: Q.DEFECTS.map(function (d) { return { v: d.id, l: DEFECT_PLAIN[d.id] || d.short }; })
      }
    ];
  }

  function evalBall(input, defects) {
    var exp = Q.feeSpec(input);
    var probe = Q.defectProbe(input).filter(function (p) { return p.differs; }).map(function (p) { return p.id; });
    var active = probe.filter(function (id) { return defects.indexOf(id) >= 0; });
    var act = active.length ? Q.calcWithDefects(input, active) : exp;
    return {
      input: input, expected: exp, actual: act, pass: active.length === 0,
      hits: active, diff: active.length ? Q.compareFee(exp, act).join(' / ') : '账算得完全一致！'
    };
  }

  function compute(st) {
    var r = Q.ecExecute({
      field: st.field, level: st.level, strategy: st.strategy,
      includeInvalid: st.includeInvalid, defects: st.defects, customCases: st.customCases
    });
    var ballRes = st.lastBall ? evalBall(st.lastBall.input, st.defects) : null;
    return { r: r, ball: ballRes, ballLabel: st.lastBall ? st.lastBall.label : '' };
  }

  function viz(res, st) {
    var r = res.r;
    var cov = r.coverage;

    var kpis = Q.kpiStrip([
      { icon: '🧺', label: '输入框分组覆盖率', value: Q.pctText(cov.rate), sub: '测了 ' + cov.covered + ' / ' + cov.total + ' 组', tone: cov.rate >= 100 ? 'ok' : 'warn' },
      { icon: '🛡️', label: '乱填拦截测试', value: Q.pctText(cov.invalidRate), sub: cov.invalidCovered + ' / ' + cov.invalidTotal + ' 个非法桶', tone: st.includeInvalid ? 'ok' : 'bad' },
      { icon: '💥', label: '测出账算错了', value: r.failCount + ' / ' + r.cases.length, sub: '实际跑出差异的用例数', tone: r.failCount > 0 ? 'warn' : 'blue' },
      { icon: '🐛', label: '捕获暗藏 Bug', value: r.detectedCount + ' / ' + r.matrix.length, sub: '组合虫需加多字段用例', tone: r.detectedCount >= 4 ? 'ok' : 'blue' }
    ]);

    /* 互动投球小游乐场 */
    var quickBtns = SAMPLE_BALLS.map(function (b, idx) {
      return '<button type="button" class="btn sm" data-act="drop-sample" data-idx="' + idx + '">' + Q.esc(b.label) + '</button>';
    }).join('');
    var ballHtml = '';
    if (res.ball) {
      var b = res.ball;
      var actErr = (b.actual.errors || []).join('、') || b.actual.code || '参数非法';
      var actTxt = b.actual.ok ? ('收 ' + b.actual.payable + ' 元') : ('拒收(' + actErr + ')');
      var expTxt = b.expected.ok ? ('应收 ' + b.expected.payable + ' 元') : ('应拒收');
      ballHtml = '<div class="ball-drop-pill ' + (b.pass ? 'ok' : 'bad') + ' mt10">' +
        '<span>' + (b.pass ? '🟢 安全落桶：' : '💥 抓到 Bug！') + Q.esc(res.ballLabel) + '</span>' +
        '<span>· 理论' + Q.esc(expTxt) + '，被测系统 → ' + Q.esc(actTxt) + (b.pass ? '' : '（' + Q.esc(b.diff) + '）') + '</span>' +
      '</div>';
    } else {
      ballHtml = '<div class="tiny muted mt10">👆 点上面任意一颗“测试球”丢进系统，立刻看它算对了还是踩坑报错！</div>';
    }
    var ballStage = '<div class="ball-stage">' +
      '<div style="width:100%"><div class="card-t mb6">🎲 测试球即时试玩（每颗球代表一“同类人群”）</div>' +
      '<div class="btn-row">' + quickBtns + '</div>' + ballHtml + '</div>' +
    '</div>';

    /* 绿桶 & 红桶直观分布 */
    function renderBuckets(list, title, emptyMsg) {
      return '<div class="clsgroup"><div class="clsgroup-h">' + title + '</div><div class="clsrow">' +
        (list.length ? list.map(function (c) {
          var cnt = r.cases.filter(function (x) { return x.cls === c.id; }).length;
          return '<div class="cls ' + (cnt ? 'on' : '') + '">' +
            '<span class="cls-id">' + Q.esc(c.id) + '</span>' +
            '<span class="cls-nm">' + Q.esc(c.name) + '</span>' +
            '<span class="cls-ct">' + (cnt ? '✅ ' + cnt + ' 球' : '⬜ 漏了') + '</span></div>';
        }).join('') : '<div class="tiny muted">' + emptyMsg + '</div>') +
      '</div></div>';
    }
    var bucketsHtml = '<div class="card"><div class="card-h"><span class="card-t">🧺 同一栏里的等价分桶图</span><span class="card-sub">每只绿桶、红桶至少要放进 1 颗测试球</span></div>' +
      '<div class="card-b"><div class="clsmap">' +
        renderBuckets(r.classes.filter(function (c) { return c.validClass; }), '🟢 合法有效区（按规矩能过）', '无有效类') +
        renderBuckets(r.classes.filter(function (c) { return !c.validClass; }), '🔴 非法无效区（必须拦在门外）', '无无效类') +
      '</div></div></div>';

    /* 4只Bug卡片 */
    var dmHtml = '<div class="dmatrix">' + r.matrix.map(function (d) {
      return '<div class="dm ' + (d.detected ? 'dm-hit' : 'dm-miss') + (d.injected ? ' dm-inj' : '') + '">' +
        '<div class="dm-h"><span class="mono" style="font-weight:800">' + Q.esc(d.id) + '</span>' +
        Q.badge(d.detected ? 'pass' : 'mute', d.detected ? '🎉 抓住了 ' + d.caseCount + '次' : '还没抓到') + '</div>' +
        '<div class="dm-n">' + Q.esc(DEFECT_PLAIN[d.id] || d.short) + '</div>' +
        '<div class="dm-r">' + (d.id === 'RETRAIN_STACK' && !d.detected ? '💡 单改一个数捉不到它，点上方「⚡ 组合坑」!' : Q.esc(d.name)) + '</div>' +
      '</div>';
    }).join('') + '</div>';

    var d4 = r.matrix.find(function (m) { return m.id === 'RETRAIN_STACK'; });
    var coachBox = !st.includeInvalid
      ? Q.coach('bad', '警告：你把「非法无效区」关掉啦！', '只测正常数字（比如只测 1~120），一旦用户手抖输入 0 或小数，系统崩溃你也发现不了。赶紧在下面「高级调节」里勾选回去！')
      : (d4 && !d4.detected
        ? Q.coach('warn', '分桶已经 100% 亮绿灯，为啥还有 D4 组合 Bug 没抓到？', '因为每次只改一个框（其他框固定成默认值），永远碰不上“3人团体 + 复训老学员”同时发生的情况！点一下上面橙色按钮 <b>「⚡ 一键试组合坑 (D4)」</b> 立刻破案！')
        : Q.coach('ok', '全能捕捉手！单桶和组合陷阱都抓到了', '你已经掌握了等价类精髓：同类挑 1 个代表就能大幅减少用例数；而跨字段的叠加规则，再额外补一条组合用例就万无一失！'));

    /* 次级明细 + 自定义表单放进折叠抽屉 */
    var caseRows = r.cases.map(function (c) {
      return [
        { html: '<span class="mono">' + Q.esc(c.id) + '</span>' },
        c.cls === 'CUSTOM' ? { html: Q.badge('warn', '组合补充') } : c.clsName,
        c.input.hours + '课时 / ' + c.input.seats + '人 / 券' + c.input.coupon + ' / ' + c.input.type,
        c.expected.ok ? c.expected.payable + '元' : '拦截',
        c.actual.ok ? c.actual.payable + '元' : '拦截',
        { html: c.pass ? Q.badge('pass', '正常') : Q.badge('fail', '💥 爆Bug: ' + Q.esc(c.diff || '')) }
      ];
    });
    var custForm = '<div class="cust-grid mt12">' +
      '<label>课时<input id="c-h" type="number" value="11"></label>' +
      '<label>人数<input id="c-s" type="number" value="3"></label>' +
      '<label>券(元)<input id="c-c" type="number" value="0"></label>' +
      '<label>学员类型<select id="c-t"><option value="new">新生</option><option value="retrain" selected>复训</option><option value="corp">企业</option></select></label>' +
      '<label>持证<select id="c-cert"><option value="1" selected>是</option><option value="0">否</option></select></label>' +
      '<button type="button" class="btn primary sm" data-act="add-custom">+ 加一条用例</button>' +
    '</div>';
    var detailBody = Q.table(['编号', '所属桶', '填入参数', '应当结果', '实测结果', '判定'], caseRows) + custForm;

    return kpis + ballStage + bucketsHtml + dmHtml + coachBox +
      Q.drawer('📋 查看全部 ' + r.cases.length + ' 条测试用例明细 / 手写加一条', '含自定义组合输入框', detailBody, false);
  }

  function onAction(act, el, st, WB) {
    if (act === 'drop-sample') {
      var idx = Number(el.getAttribute('data-idx'));
      st.lastBall = SAMPLE_BALLS[idx] || SAMPLE_BALLS[0];
      st.ballSeq = (st.ballSeq || 0) + 1;
      return true;
    }
    if (act === 'combo-preset') {
      st.customCases = [{ id: 'EX1', input: { hours: 11, seats: 3, coupon: 0, type: 'retrain', hasCert: true } }];
      st.lastBall = SAMPLE_BALLS[5];
      WB.toast('已填入“3人+复训”组合用例，立刻揪出 D4！');
      return true;
    }
    if (act === 'add-custom') {
      var hRaw = String((document.getElementById('c-h') || {}).value || '').trim();
      var sRaw = String((document.getElementById('c-s') || {}).value || '').trim();
      var cRaw = String((document.getElementById('c-c') || {}).value || '').trim();
      if (!hRaw || !sRaw || !cRaw || isNaN(Number(hRaw)) || isNaN(Number(sRaw)) || isNaN(Number(cRaw))) {
        WB.toast('课时、人数或券额留空无效，请填入数字后再添加', 'warn');
        return false;
      }
      var t = (document.getElementById('c-t') || {}).value || 'new';
      var cert = ((document.getElementById('c-cert') || {}).value || '1') === '1';
      st.customCases = (st.customCases || []).concat([{
        id: 'U' + (st.customCases.length + 1),
        input: { hours: Number(hRaw), seats: Number(sRaw), coupon: Number(cRaw), type: t, hasCert: cert }
      }]);
      return true;
    }
  }

  function evidence(res) {
    var r = res.r;
    var ok = r.coverage.rate >= 100 && r.failCount > 0;
    return {
      status: ok ? 'pass' : 'warn',
      pass: ok,
      coverage: r.coverage.rate || 0,
      label: '等价类覆盖率',
      defects: r.matrix.filter(function (m) { return m.detected; }).map(function (m) { return m.id; }),
      summary: '分桶覆盖 ' + Q.pctText(r.coverage.rate) + '，抓获 ' + r.detectedCount + '/' + r.matrix.length + ' 只缺陷',
      metrics: { coverage: r.coverage.rate, failCount: r.failCount }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢等价类划分',
      '<b>物以类聚，同一批输入挑 1 个代表就够了！</b>记住两个铁律：合法的每类挑 1 个，<b>非法的也要专门挑</b>；遇到“满 3 人且是复训”这种多条件组合，要另补一条合体用例！');
  }

  window.WB.registerExp({
    id: 'm2', no: 2, group: '黑盒用例设计',
    title: '等价分区 · 投篮分类', chapter: '第 2 章 · 等价类划分',
    hook: '把几百万种输入分进几只代表桶，挑代表去抓错',
    goal: ['不用穷举，每类挑 1 个代表也能抓虫', '明白为什么只测单一输入框会漏掉组合 Bug'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

/* ============================================================================
 * m3.js — 第 3 关：边界值跳崖数轴（邻点捉虫动画）
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  function makeDefaults() {
    return {
      field: 'seats',
      strategy: 'off',
      base: 'typical',
      defects: ['SEAT_BOUNDARY', 'ROUND_DOWN', 'COUPON_CAP', 'RETRAIN_STACK'],
      animStep: -1
    };
  }

  function buildParams() {
    return [
      {
        key: 'field', label: '看哪一条数的边界线', type: 'pills',
        options: [
          { v: 'seats', l: '👥 报名人数 (2|3、5|6、10|11、20|21)' },
          { v: 'hours', l: '⏱️ 课时 (0|1、120|121)' },
          { v: 'coupon', l: '🎟️ 优惠券 (-1|0、500|501)' }
        ]
      },
      {
        key: 'strategy', label: '边界点怎么踩', type: 'pills',
        options: [
          { v: 'on', l: '仅踩线两边 (2点)' },
          { v: 'off', l: '线内+外移一步 (3值)' },
          { v: 'full', l: '3值 + 域端点' }
        ]
      },
      { type: 'action', action: 'animate-bv', label: '▶️ 动画挨个踩边界点', variant: 'fun' },
      { key: 'base', label: '其他框固定预设', type: 'select', advanced: true, options: [{ v: 'typical', l: '11 课时 / 持证' }, { v: 'small', l: '1 课时 / 持证' }, { v: 'large', l: '120 课时 / 无证' }] },
      {
        key: 'defects', label: '开启系统内藏的 Bug', type: 'checks', advanced: true,
        options: Q.DEFECTS.map(function (d) { return { v: d.id, l: d.id + ' ' + d.short }; })
      }
    ];
  }

  function compute(st) {
    return Q.bvExecute({ field: st.field, strategy: st.strategy, base: st.base, defects: st.defects });
  }

  function renderNumberLineSvg(r, animStep) {
    var W = 880, H = 186, padL = 62, padR = 54;
    var vals = r.cases.map(function (c) { return c.value; }).concat(r.domain);
    var minV = Math.min.apply(null, vals);
    var maxV = Math.max.apply(null, vals);
    var span = Math.max(1, maxV - minV);
    function xOf(v) { return padL + ((v - minV) / span) * (W - padL - padR); }

    var svg = [];
    svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="边界跳崖数轴图">');
    var x0 = xOf(r.domain[0]), x1 = xOf(r.domain[1]);
    /* 底层安全跑道 vs 两侧悬崖线 */
    svg.push('<line x1="' + padL + '" y1="96" x2="' + (W - padR) + '" y2="96" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>');
    svg.push('<line x1="' + x0.toFixed(1) + '" y1="96" x2="' + x1.toFixed(1) + '" y2="96" stroke="#a7f3d0" stroke-width="10" stroke-linecap="round"/>');

    /* 围栏分隔线 */
    r.pairs.forEach(function (p, pi) {
      var bx = xOf((p.below + p.above) / 2);
      svg.push('<line x1="' + bx.toFixed(1) + '" y1="34" x2="' + bx.toFixed(1) + '" y2="128" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>');
      svg.push('<rect x="' + (bx - 22).toFixed(1) + '" y="12" width="44" height="20" rx="10" fill="#fff8e6" stroke="#fcd34d"/>');
      svg.push('<text x="' + bx.toFixed(1) + '" y="26" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b45309">' + p.below + '|' + p.above + '</text>');
      void pi;
    });

    /* 测试踩点圆球（交替错开数字避免挤在一起） */
    r.cases.forEach(function (c, i) {
      var cx = xOf(c.value);
      var isCur = i === animStep;
      var fill = c.pass ? '#10b981' : '#ef4444';
      var lblY = (i % 2 === 0) ? 148 : 168;
      if (isCur) {
        svg.push('<circle cx="' + cx.toFixed(1) + '" cy="96" r="15" fill="rgba(245,158,11,0.28)" stroke="#f59e0b" stroke-width="2.5"/>');
      }
      svg.push('<circle cx="' + cx.toFixed(1) + '" cy="96" r="' + (isCur ? 9 : 7) + '" fill="' + fill + '" stroke="#ffffff" stroke-width="2.2"/>');
      if (!c.pass) {
        svg.push('<text x="' + cx.toFixed(1) + '" y="66" text-anchor="middle" font-size="13">💥</text>');
      }
      svg.push('<text x="' + cx.toFixed(1) + '" y="' + lblY + '" text-anchor="middle" font-size="11" font-weight="' + (isCur ? '800' : '700') + '" fill="' + (isCur ? '#b45309' : (c.pass ? '#0f2744' : '#b91c1c')) + '">' + c.value + '</text>');
    });

    svg.push('</svg>');
    return svg.join('');
  }

  function viz(res, st) {
    var curIdx = (st.animStep >= 0 && st.animStep < res.cases.length) ? st.animStep : -1;
    var curCase = curIdx >= 0 ? res.cases[curIdx] : null;

    var kpis = Q.kpiStrip([
      { icon: '🚧', label: '边界围栏命中率', value: Q.pctText(res.hitRate), sub: '卡准 ' + res.boundaryHit + '/' + res.boundaryTotal + ' 道门槛线', tone: res.hitRate >= 100 ? 'ok' : 'warn' },
      { icon: '👟', label: '共踩了多少点', value: res.caseCount + ' 个', sub: '安全区间+临界越界', tone: 'blue' },
      { icon: '💥', label: '当场抓到差1错', value: res.failCount + ' 个', sub: '红点爆破说明算错钱或拦错了', tone: res.failCount ? 'warn' : 'ok' },
      { icon: '🐛', label: '累计破获 Bug', value: res.detectedCount + ' / 4', sub: '含 D1 边界 / D2 取整差1元', tone: res.detectedCount ? 'ok' : 'blue' }
    ]);

    var stepSpot = curCase
      ? '<div class="ball-drop-pill ' + (curCase.pass ? 'ok' : 'bad') + ' mt10">' +
          '<span>👟 第 ' + (curIdx + 1) + '/' + res.cases.length + ' 步踩在【' + curCase.value + '】→ ' +
          (curCase.pass ? '正常通过！' : '💥 抓到差1坑：' + Q.esc(curCase.diff || '输出不对')) + '</span>' +
        '</div>'
      : '<div class="tiny muted mt10">💡 绿条 = 合法安全区 · 黄虚线 = 折扣/范围门槛 · 点上方「▶️ 动画挨个踩边界点」看红球在哪里爆炸！</div>';

    var trackCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🚧 边界跳崖数轴（红球 💥 = 当场揪出的 Bug）</span></div>' +
      '<span class="badge ' + (res.failCount ? 'warn' : 'pass') + '">合法范围：' + res.domain[0] + ' ~ ' + res.domain[1] + '</span>' +
    '</div><div class="card-b"><div class="chart-box">' + renderNumberLineSvg(res, curIdx) + stepSpot + '</div></div></div>';

    var coachBox = st.field === 'seats'
      ? Q.coach(res.failCount ? 'ok' : 'info', '为什么「报名人数」2 和 3 之间最容易出事？',
        '规格写着「3人起才享95折」，如果程序员把 <code>seats &gt;= 3</code> 手抖写成 <code>seats &gt;= 2</code>，测 1 人对、测 4 人也对，<b>唯独踩在 2|3 这条门槛线上才会当场抓现行！</b>')
      : Q.coach('info', '所有临界点都踩一遍！',
        '无论输入多大范围，最容易把 <code>&gt;</code> 写成 <code>&gt;=</code> 的漏洞都趴在“正好等于边界值”以及“多1、少1”这两个位置上。');

    var rows = res.cases.map(function (c, i) {
      return [
        i + 1,
        { html: '<b>' + Q.esc(c.value) + '</b>' },
        c.expected.ok ? c.expected.payable + '元' : '拦截',
        c.actual.ok ? c.actual.payable + '元' : '拦截',
        { html: c.pass ? Q.badge('pass', '正常') : Q.badge('fail', '💥 ' + Q.esc(c.diff || '报错')) }
      ];
    });

    return kpis + trackCard + coachBox +
      Q.drawer('📋 展开全部 ' + res.cases.length + ' 个边界点实测流水表', '点击查看每个点详情', Q.table(['#', '测试值', '理论应收', '实际返回', '判定'], rows), false);
  }

  function onAction(act, el, st, WB, update) {
    if (act === 'animate-bv') {
      var res = compute(st);
      var total = res.cases.length;
      if (!total) return;
      if (WB.session.animTimer) clearInterval(WB.session.animTimer);
      st.animStep = 0;
      update(false);
      WB.session.animTimer = setInterval(function () {
        if (st.animStep + 1 >= total) {
          clearInterval(WB.session.animTimer);
          WB.session.animTimer = null;
          return;
        }
        st.animStep += 1;
        update(false);
      }, 460);
    }
  }

  function evidence(res) {
    return {
      status: res.hitRate >= 100 && res.failCount > 0 ? 'pass' : 'warn',
      pass: res.hitRate >= 100,
      coverage: res.hitRate || 0,
      label: '边界对命中率',
      defects: res.matrix.filter(function (m) { return m.detected; }).map(function (m) { return m.id; }),
      summary: '命中边界 ' + res.boundaryHit + '/' + res.boundaryTotal + ' 对，爆出 ' + res.failCount + ' 处差1 Bug',
      metrics: { hitRate: res.hitRate, failCount: res.failCount }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢边界值分析',
      '<b>Bug 最喜欢躲在门槛两边的“差 1”位置上！</b>记住口诀：<b>测边界（卡线）、测离点（多 1 和少 1）</b>—— 比如规定 1~120，必测 <code>0, 1, 2</code> 和 <code>119, 120, 121</code>！');
  }

  window.WB.registerExp({
    id: 'm3', no: 3, group: '黑盒用例设计',
    title: '边界跳崖 · 邻点捉虫', chapter: '第 2 章 · 边界值分析',
    hook: 'Bug 最爱躲在刚好卡线和加减 1 的门槛边上',
    goal: ['用动画看懂“上点 + 离点”如何抓出 >= 写错成 > 的 Bug', '体会人数多档折扣边界怎么逐一排查'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();


/* ===== src/modules/m4.js ===== */
/* ============================================================================
 * m4.js — 第 4 关：决策表开关灯箱
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  function makeDefaults() {
    return {
      preset: 'complete',
      strategy: 'first',
      scope: 'full',
      rules: Q.dtPresetRules('complete')
    };
  }

  function buildParams() {
    return [
      {
        key: 'preset', label: '先看一套现成规则剧本', type: 'pills', wide: true,
        options: [
          { v: 'complete', l: '✅ 完美无漏(7条)' },
          { v: 'missing', l: '🕳️ 忘写R7(有盲区)' },
          { v: 'conflict', l: '💥 两条规则打架' },
          { v: 'wrong', l: '❌ 动作写错(放水)' }
        ]
      },
      {
        key: 'strategy', label: '规则打架怎么收场', type: 'pills',
        options: [
          { v: 'first', l: '按第一条算' },
          { v: 'strict', l: '从严兜底' },
          { v: 'block', l: '打架立刻拦停' }
        ]
      },
      { key: 'scope', label: '显示组合格数', type: 'select', advanced: true, options: [{ v: 'full', l: '全部 16 种排列组合' }, { v: 'reachable', l: '合并不可达后 9 种' }] }
    ];
  }

  function onParam(k, v, st) {
    if (k === 'preset') st.rules = Q.dtPresetRules(v);
  }

  function compute(st) {
    return Q.dtEvaluate(st.rules, { strategy: st.strategy, scope: st.scope });
  }

  function viz(res, st) {
    var kpis = Q.kpiStrip([
      { icon: '💡', label: '灯格覆盖率', value: Q.pctText(res.coverage), sub: res.covered + ' / ' + res.total + ' 种组合已被管住', tone: res.uncovered.length ? 'warn' : 'ok' },
      { icon: '🎯', label: '与规格一致率', value: Q.pctText(res.accuracy), sub: '错判 ' + res.wrong.length + ' 格', tone: res.wrong.length ? 'bad' : 'ok' },
      { icon: '💥', label: '规则打架格', value: res.conflicts.length + ' 格', sub: '同一组合同时命中≥2条冲突规则', tone: res.conflicts.length ? 'warn' : 'ok' },
      { icon: '🕳️', label: '漏写盲区', value: res.uncovered.length + ' 格', sub: '没有任何规则命中的空档', tone: res.uncovered.length ? 'bad' : 'ok' }
    ]);

    /* 16 格彩色结果灯箱 */
    var byKey = {};
    res.rows.forEach(function (r) { byKey[r.key] = r; });
    var colBits = ['00', '01', '11', '10'];
    var colLbl = ['C3=N C4=N', 'C3=N C4=Y', 'C3=Y C4=Y', 'C3=Y C4=N'];
    var rowBits = ['00', '01', '11', '10'];
    var rowLbl = ['C1=N C2=N', 'C1=N C2=Y', 'C1=Y C2=Y', 'C1=Y C2=N'];

    var gridHtml = '<div class="matrix">' +
      '<div class="mx-corner">开关组合</div>' +
      colLbl.map(function (l) { return '<div class="mx-h">' + l + '</div>'; }).join('');
    rowBits.forEach(function (rb, ri) {
      gridHtml += '<div class="mx-rh">' + rowLbl[ri] + '</div>';
      colBits.forEach(function (cb) {
        var key = rb + cb;
        var row = byKey[key];
        if (!row) {
          gridHtml += '<div class="mx-c mx-na"><span class="mx-g">—</span><span class="mx-a">不参与</span></div>';
          return;
        }
        var cls = 'mx-c ';
        var glyph = '✅';
        if (row.status === 'uncovered') { cls += 'mx-uncovered'; glyph = '🕳️'; }
        else if (row.status === 'conflict' || row.status === 'blocked') { cls += 'mx-conflict'; glyph = '💥'; }
        else if (!row.correct) { cls += 'mx-wrong'; glyph = '🚨'; }
        else { cls += 'mx-ok'; }

        var actName = row.resolved ? Q.APP_ACTIONS[row.resolved].label : '无输出';
        gridHtml += '<div class="' + cls + '" title="匹配规则：' + Q.esc(row.matched.join(', ') || '无') + '">' +
          '<span class="mx-g">' + glyph + '</span>' +
          '<span class="mx-a">' + Q.esc(actName) + '</span>' +
          '<span class="mx-k">' + (row.matched.join('+') || '空') + '</span>' +
        '</div>';
      });
    });
    gridHtml += '</div>';

    var matrixCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🚦 16 种条件组合结果灯箱</span> <span class="card-sub">绿灯=算对 · 红灯=算错 · 黄爆=打架 · 灰洞=漏规则</span></div></div>' +
      '<div class="card-b">' + gridHtml + '</div></div>';

    /* 可手点的开关规则表 */
    var condHeaders = Q.DT_COND_LABELS.map(function (c) { return c.key + ' ' + c.label; });
    var ruleRows = st.rules.map(function (r, ri) {
      var cells = r.c.map(function (val, ci) {
        var cv = val === 'Y' ? 'cv-y' : (val === 'N' ? 'cv-n' : 'cv-d');
        return { html: '<button type="button" class="cellbtn ' + cv + '" data-act="cycle-cell" data-r="' + ri + '" data-c="' + ci + '">' + Q.esc(val) + '</button>' };
      });
      return [{ html: '<b>' + Q.esc(r.id) + '</b>' }].concat(cells).concat([
        { html: '<button type="button" class="actbtn a-' + r.action + '" data-act="cycle-act" data-r="' + ri + '">' + Q.esc(Q.APP_ACTIONS[r.action].label) + '</button>' },
        { html: '<span class="tiny muted">' + Q.esc(r.note || '可点按钮改条件') + '</span>' }
      ]);
    });
    var ruleCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🎛️ 规则开关面板（点击任意 Y / N / — 或结论都能实时改！）</span></div>' +
      '</div><div class="card-b flush">' + Q.table(['规则'].concat(condHeaders).concat(['动作结论', '说明']), ruleRows) + '</div></div>';

    var coachBox = res.accuracy === 100 && !res.conflicts.length && !res.uncovered.length
      ? Q.coach('ok', '满分灯箱！16 盏灯全绿通关', '4 个条件共 2⁴=16 种组合没有一处遗漏、没有一处打架，而且全部分毫不差！现实中遇到多条件审批，画决策表最不容易写漏 <code>else</code>！')
      : (res.uncovered.length
        ? Q.coach('bad', '抓到了！发现 ' + res.uncovered.length + ' 个灰色空洞盲区', '删掉 R7 后，遇到特定组合没有任何规则兜底，系统会直接发懵返回“空”！点回「✅ 完美无漏」或者把规则里条件调通即可修复。')
        : (res.conflicts.length
          ? Q.coach('warn', '报警！规则打架了（黄色 💥）', '同一套条件同时命中了两条给不同结论的规则！用「按第一条算」可能误放水，调成「打架立刻拦停」就能在上线前把它揪出来！')
          : Q.coach('bad', '抓到了动作写错的红灯（🚨）！', '规则是覆盖到了，但结果把本该「条件通过」写成了直接「通过」——决策表能把每一个格子的预期和实际掰开对照！')));

    var diagRows = res.ruleDiag.map(function (d) {
      return [
        d.id,
        d.match + ' 格',
        { html: d.status === 'active' ? Q.badge('pass', '生效') : Q.badge('warn', d.status === 'shadowed' ? '被前面规则遮住' : '无效规则') },
        d.note || '正常起作用'
      ];
    });
    return kpis + matrixCard + ruleCard + coachBox +
      Q.drawer('🔍 每条规则体检表（看有没有多余或被遮蔽的规则）', res.ruleDiag.length + ' 条规则', Q.table(['规则', '管了多少格', '体检状态', '备注'], diagRows), false);
  }

  function onAction(act, el, st) {
    if (act === 'cycle-cell') {
      var ri = Number(el.getAttribute('data-r'));
      var ci = Number(el.getAttribute('data-c'));
      var order = ['Y', 'N', '-'];
      var cur = st.rules[ri].c[ci];
      st.rules[ri].c[ci] = order[(order.indexOf(cur) + 1) % order.length];
      return true;
    }
    if (act === 'cycle-act') {
      var rIdx = Number(el.getAttribute('data-r'));
      var aOrder = ['PASS', 'COND_A', 'COND_B', 'REJECT'];
      var curA = st.rules[rIdx].action;
      st.rules[rIdx].action = aOrder[(aOrder.indexOf(curA) + 1) % aOrder.length];
      return true;
    }
  }

  function evidence(res) {
    var ok = res.accuracy === 100 && res.conflicts.length === 0 && res.uncovered.length === 0;
    return {
      status: ok ? 'pass' : 'warn',
      pass: ok,
      coverage: res.accuracy || 0,
      label: '与规格一致率',
      defects: [],
      summary: '覆盖 ' + res.covered + '/' + res.total + ' 格，一致率 ' + Q.pctText(res.accuracy),
      metrics: { accuracy: res.accuracy, conflicts: res.conflicts.length }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢决策表',
      '<b>把多个“如果……而且……”的组合全部摊开在桌面上！</b>4 个是/否条件就有 2⁴ = 16 格，用表格一眼看穿：<b>有没有漏写某个分支（空洞）？有没有两条规则打架（冲突）？</b>');
  }

  window.WB.registerExp({
    id: 'm4', no: 4, group: '黑盒用例设计',
    title: '决策开关 · 规则灯箱', chapter: '第 2 章 · 决策表测试',
    hook: '多条件组合怕写漏或打架？点亮 16 格灯箱一眼看穿',
    goal: ['体验漏规则造成的盲区与规则冲突打架', '学会点击开关微调规则并核对全部组合'],
    defaults: makeDefaults(), params: buildParams, onParam: onParam,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

/* ============================================================================
 * m5.js — 第 5 关：状态迁移小火车游乐场
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  function makeDefaults() {
    return {
      events: ['submit', 'startReview', 'approve', 'book', 'attend', 'complete'],
      seatsLeft: 1,
      allowPromote: false,
      allowRevise: true,
      allowReopen: false
    };
  }

  function buildParams() {
    return [
      {
        key: 'seatsLeft', label: '当前剩余名额（决定预约去哪站）', type: 'pills',
        options: [
          { v: '1', l: '🎟️ 名额够 (余 1 名)' },
          { v: '0', l: '🈵 满员了 (余 0 名)' }
        ]
      },
      { type: 'action', action: 'fsm-auto', label: '⚡ 一键跑满推荐路线', variant: 'primary' },
      { type: 'action', action: 'fsm-bad-demo', label: '🧪 故意乱点测拦截', variant: 'fun' },
      { type: 'action', action: 'fsm-clear', label: '🧹 回到草稿起点', variant: '' },
      { key: 'allowPromote', label: '允许「候补转正」', type: 'checkbox', advanced: true, hint: '开启后候补可转已预约' },
      { key: 'allowRevise', label: '允许「驳回修改重提」', type: 'checkbox', advanced: true, hint: '已驳回可退回草稿' },
      { key: 'allowReopen', label: '允许「取消后重开」', type: 'checkbox', advanced: true, hint: '已取消可重回草稿' }
    ];
  }

  function compute(st) {
    return Q.fsmRun({
      events: st.events,
      seatsLeft: Number(st.seatsLeft),
      toggles: { allowPromote: st.allowPromote, allowRevise: st.allowRevise, allowReopen: st.allowReopen }
    });
  }

  function renderFsmSvg(res) {
    var W = 910, H = 300, bw = 88, bh = 36;
    var activeIds = {};
    res.active.forEach(function (t) { activeIds[t.id] = true; });
    var hitTids = {};
    res.trace.forEach(function (t) { if (t.ok && t.tid) hitTids[t.tid] = true; });
    var visStates = {};
    res.coveredStates.forEach(function (id) { visStates[id] = true; });

    var bySt = {};
    Q.FSM_STATES.forEach(function (s) { bySt[s.id] = s; });

    var svg = [];
    svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="报名系统状态流转地铁图">');
    svg.push('<defs>' +
      '<marker id="fsmArwOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#0e9f8a"/></marker>' +
      '<marker id="fsmArwOff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#cbd5e1"/></marker>' +
    '</defs>');

    /* 边：已解锁路线绿色流动，未解锁虚线灰，禁用淡灰 */
    Q.FSM_TRANSITIONS.forEach(function (t) {
      var a = bySt[t.from], b = bySt[t.to];
      if (!a || !b) return;
      var enabled = Boolean(activeIds[t.id]);
      var hit = Boolean(hitTids[t.id]);
      var x1 = a.x, y1 = a.y, x2 = b.x, y2 = b.y;
      var dy = y2 - y1, dx = x2 - x1;
      var sx = x1 + (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? bw / 2 : -bw / 2) : 0);
      var sy = y1 + (Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? bh / 2 : -bh / 2) : (dy > 20 ? 10 : 0));
      var ex = x2 - (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? bw / 2 + 4 : -(bw / 2 + 4)) : 0);
      var ey = y2 - (Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? bh / 2 + 4 : -(bh / 2 + 4)) : (dy > 20 ? 10 : 0));
      var mx = (sx + ex) / 2, my = (sy + ey) / 2 + (t.id === 'T12' || t.id === 'T13' ? 36 : (dy === 0 ? -16 : 0));
      var path = 'M ' + sx + ' ' + sy + ' Q ' + mx + ' ' + my + ' ' + ex + ' ' + ey;
      var stroke = !enabled ? '#e2e8f0' : (hit ? '#0e9f8a' : '#94a3b8');
      var cls = hit ? 'fsm-edge-active' : '';
      var dash = hit ? '6 4' : (enabled ? 'none' : '4 4');
      svg.push('<path class="' + cls + '" d="' + path + '" fill="none" stroke="' + stroke + '" stroke-width="' + (hit ? 2.8 : 1.7) + '" stroke-dasharray="' + dash + '" marker-end="url(#' + (hit ? 'fsmArwOn' : 'fsmArwOff') + ')"/>');
    });

    /* 站点节点 */
    Q.FSM_STATES.forEach(function (s) {
      var x = s.x - bw / 2, y = s.y - bh / 2;
      var isCur = res.final === s.id;
      var isVis = Boolean(visStates[s.id]);
      var fill = isCur ? '#0284c7' : (isVis ? '#ecfdf5' : '#ffffff');
      var stroke = isCur ? '#0369a1' : (isVis ? '#10b981' : '#cbd5e1');
      var textFill = isCur ? '#ffffff' : (isVis ? '#065f46' : '#475569');
      if (isCur) {
        svg.push('<rect x="' + (x - 5) + '" y="' + (y - 5) + '" width="' + (bw + 10) + '" height="' + (bh + 10) + '" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>');
      }
      svg.push('<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="12" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>');
      svg.push('<text x="' + s.x + '" y="' + (s.y + 4.5) + '" text-anchor="middle" font-size="12" font-weight="800" fill="' + textFill + '">' +
        (isCur ? '🚂 ' : '') + s.label + '</text>');
    });
    svg.push('</svg>');
    return svg.join('');
  }

  function viz(res, st) {
    var cov = res.coverage;
    var lastStep = res.trace[res.trace.length - 1];
    var legalEventsFromCur = {};
    res.active.forEach(function (t) { if (t.from === res.final) legalEventsFromCur[t.event] = true; });

    var kpis = Q.kpiStrip([
      { icon: '🚂', label: '火车停靠车站', value: Q.fsmStateLabel(res.final), sub: '点击下面操作按钮继续开动', tone: 'blue' },
      { icon: '🚉', label: '车站覆盖', value: cov.state.covered + ' / ' + cov.state.total, sub: Q.pctText(cov.state.rate) + ' 的车站去过', tone: cov.state.rate >= 100 ? 'ok' : 'teal' },
      { icon: '🔀', label: '路线解锁率', value: Q.pctText(cov.transition.rate), sub: '跑过 ' + cov.transition.covered + '/' + cov.transition.total + ' 条路', tone: cov.transition.rate >= 80 ? 'ok' : 'warn' },
      { icon: '🚧', label: '拦下乱点违规', value: res.invalid.length + ' 次', sub: '点错状态按钮必须拦住！', tone: res.invalid.length ? 'ok' : 'blue' }
    ]);

    var mapCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🚂 状态流转小火车线路图</span> <span class="card-sub">蓝框 = 当前站 · 绿线 = 走过的路 · 虚线 = 还没试过</span></div>' +
      '<span class="badge pass">余名额：' + res.seatsLeft + '</span></div>' +
      '<div class="card-b"><div class="chart-box">' + renderFsmSvg(res) + '</div></div></div>';

    /* 手点遥控面板 */
    var evtButtons = Q.FSM_EVENTS.map(function (ev) {
      var isLegal = Boolean(legalEventsFromCur[ev.id]);
      return '<button type="button" class="btn sm ' + (isLegal ? 'primary' : '') + '" data-act="fsm-push" data-ev="' + ev.id + '">' +
        (isLegal ? '▶ ' : '🚫 ') + Q.esc(ev.label) +
      '</button>';
    }).join('');

    var seqHtml = res.trace.length
      ? res.trace.map(function (t) {
        return '<span class="seqchip ' + (t.ok ? 'ok' : 'bad') + '">' +
          t.index + '. ' + Q.esc(t.eventLabel) + (t.ok ? ' → ' + Q.fsmStateLabel(t.to) : ' (被拦)') +
        '</span>';
      }).join('')
      : '<span class="tiny muted">还在「草稿」起点站，点下面按钮开动小火车！</span>';

    var consoleCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🎮 站点遥控台（蓝色▶ = 当前可走；🚫 = 可故意乱点测试门卫是否拦得住）</span></div>' +
      '<button type="button" class="btn sm" data-act="fsm-pop">↩ 退一步</button></div>' +
      '<div class="card-b">' +
        '<div class="btn-row">' + evtButtons + '</div>' +
        '<div class="seqbox mt10">' + seqHtml + '</div>' +
      '</div></div>';

    var coachBox = lastStep && !lastStep.ok
      ? Q.coach('bad', '🚧 门卫立功！违规操作「' + lastStep.eventLabel + '」被直接拦在站外',
        Q.esc(lastStep.reason || '当前车站不允许直接做这个动作') + '。这就是状态测试的核心任务之一：<b>不仅要测顺风流程，还要专门在错误状态下乱点，确认系统不会发疯！</b>')
      : (cov.transition.rate >= 80
        ? Q.coach('ok', '跑图高手！已解锁 ' + cov.transition.covered + '/' + cov.transition.total + ' 条轨道',
          '主流线路和分支基本跑通了。记得再点一次「🧪 故意乱点测拦截」，收集一次非法跳转拦截记录！')
        : Q.coach('info', '接着换条岔路跑跑看！',
          '目前跑过的路线偏主干。试着把名额切换成 <code>满员 0</code> 跑进候补站，或者驳回/取消，或者点橙色「⚡ 一键跑满推荐路线」！'));

    var logRows = res.trace.map(function (t) {
      return [
        t.index,
        t.eventLabel,
        Q.fsmStateLabel(t.from),
        { html: t.ok ? Q.badge('pass', '→ ' + Q.fsmStateLabel(t.to)) : Q.badge('fail', '被拦: ' + Q.esc(t.reason || '')) }
      ];
    });
    return kpis + mapCard + consoleCard + coachBox +
      Q.drawer('📜 展开行车步数流水日志 & 漏跑路线清单', res.trace.length + ' 步', Q.table(['步', '按键', '出发站', '结果'], logRows), false);
  }

  function onAction(act, el, st, WB) {
    if (act === 'fsm-push') {
      st.events = (st.events || []).concat([el.getAttribute('data-ev')]);
      return true;
    }
    if (act === 'fsm-pop') {
      st.events = (st.events || []).slice(0, -1);
      return true;
    }
    if (act === 'fsm-clear') {
      st.events = [];
      return true;
    }
    if (act === 'fsm-bad-demo') {
      st.events = (st.events || []).concat(['attend']);
      WB.toast('故意点「签到参训」测试门卫拦截！');
      return true;
    }
    if (act === 'fsm-auto') {
      var seq;
      if (Number(st.seatsLeft) === 0) {
        seq = st.allowRevise
          ? ['submit', 'startReview', 'reject', 'revise', 'submit', 'startReview', 'approve', 'book']
          : ['submit', 'startReview', 'approve', 'book'];
        if (st.allowPromote) seq.push('promote', 'attend', 'certify');
        else seq.push('giveUp');
      } else {
        seq = st.allowRevise
          ? ['submit', 'startReview', 'reject', 'revise', 'submit', 'startReview', 'approve', 'book', 'attend', 'certify']
          : Q.fsmSuggest({ allowPromote: st.allowPromote, allowRevise: st.allowRevise, allowReopen: st.allowReopen }, Number(st.seatsLeft)).events;
      }
      st.events = seq;
      WB.toast('已载入最小高覆盖推荐路线（' + seq.length + ' 步）！');
      return true;
    }
  }

  function evidence(res) {
    var rate = res.coverage.transition.rate || 0;
    var ok = rate >= 60;
    return {
      status: ok ? 'pass' : 'warn',
      pass: ok,
      coverage: rate,
      label: '迁移覆盖率',
      defects: [],
      summary: '到达 ' + res.coverage.state.covered + '/' + res.coverage.state.total + ' 个状态，解锁路线 ' + Q.pctText(rate),
      metrics: { stateRate: res.coverage.state.rate, transRate: rate, invalidCount: res.invalid.length }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢状态迁移测试',
      '<b>把软件想象成一列按固定轨道行驶的地铁！</b>测试时不仅要把每站每条合法轨道全坐一遍，更要<b>专门在不合时宜的站按错按钮（如草稿直接结业）</b>，确保门卫牢牢锁门！');
  }

  window.WB.registerExp({
    id: 'm5', no: 5, group: '状态、结构与流水线',
    title: '状态闯关 · 小火车路线', chapter: '第 2 章 · 状态迁移测试',
    hook: '合法轨道要跑全，错误状态下点按钮也必须拦住',
    goal: ['用动画地铁图走完正常、候补、驳回/取消各条路', '尝试故意乱点操作，看状态机怎样当场拦下来'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

/* ============================================================================

(function () {

        ]
      },
      { type: 'action', action: 'wb-minset', label: '⚡ 一键凑齐最少通关用例', variant: 'primary' },
      { type: 'action', action: 'wb-animate', label: '▶️ 逐条点亮电路演示', variant: 'fun' },
      { type: 'action', action: 'wb-default', label: '↺ 退回初始 4 条', variant: '' },
      {
        key: 'defects', label: '注入代码隐藏Bug（用来对比变异分支）', type: 'checks', advanced: true,
        options: Q.DEFECTS.map(function (d) { return { v: d.id, l: d.id + ' ' + d.short }; })
      }
    ];
  }

  function compute(st) {
    var selected = Q.WB_LIBRARY.filter(function (c) { return (st.selectedIds || []).indexOf(c.id) >= 0; });
    var runs = selected.map(function (c) {
      return Object.assign({ id: c.id, short: c.short, label: c.label }, Q.wbRunOne(c.input, st.defects));
    });
    var analysis = Q.wbAnalyze(runs);
    var status = Q.wbCriterionStatus(analysis, st.criterion);
    return { selected: selected, runs: runs, analysis: analysis, status: status };
  }

  function renderCfgSvg(res, stepRun) {
    var W = 930, H = 260;
    var hitB = res.analysis.hitBlocks || {};
    var stepMap = {};
    if (stepRun) stepRun.blocks.forEach(function (b) { stepMap[b] = true; });

    var svg = [];
    svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="计费函数控制流电路图">');
    /* 连线 */
    Object.keys(Q.WB_CFG.edges).forEach(function (from) {
      var a = NODE_POS[from];
      if (!a) return;
      Q.WB_CFG.edges[from].forEach(function (to) {
        var b = NODE_POS[to];
        if (!b) return;
        var lit = Boolean(hitB[from] && hitB[to]);
        var hot = Boolean(stepMap[from] && stepMap[to]);
        var stroke = hot ? '#f59e0b' : (lit ? '#0e9f8a' : '#cbd5e1');
        var cls = hot ? 'fsm-edge-active' : '';
        svg.push('<line class="' + cls + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + stroke + '" stroke-width="' + (hot ? 3.2 : (lit ? 2.2 : 1.3)) + '" ' + (hot ? 'stroke-dasharray="5 3"' : (!lit ? 'stroke-dasharray="4 3"' : '')) + '/>');
      });
    });

    /* 电路节点 B01..B18 */
    Object.keys(NODE_POS).forEach(function (bid) {
      var p = NODE_POS[bid];
      var lit = Boolean(hitB[bid]);
      var hot = Boolean(stepMap[bid]);
      var fill = hot ? '#fffbeb' : (lit ? '#ecfdf5' : '#f8fafc');
      var stroke = hot ? '#f59e0b' : (lit ? '#10b981' : '#94a3b8');
      var tcol = hot ? '#b45309' : (lit ? '#065f46' : '#64748b');
      svg.push('<rect x="' + (p.x - 27) + '" y="' + (p.y - 14) + '" width="54" height="28" rx="9" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (hot ? 2.6 : 1.8) + '"' + (!lit && !hot ? ' stroke-dasharray="3 2"' : '') + '/>');
      svg.push('<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" font-size="11" font-weight="800" font-family="monospace" fill="' + tcol + '">' + bid + '</text>');
    });
    svg.push('</svg>');
    return svg.join('');
  }

  function viz(res, st) {
    var a = res.analysis;
    var s = res.status;
    var curIdx = (st.stepIdx >= 0 && st.stepIdx < res.runs.length) ? st.stepIdx : -1;
    var stepRun = curIdx >= 0 ? res.runs[curIdx] : null;

    var kpis = Q.kpiStrip([
      { icon: s.passed ? '🎉' : '⚡', label: '当前通关准则结果', value: Q.pctText(s.rate), sub: s.value + '/' + s.total + (s.passed ? ' · 全绿达标！' : ' · 还差几个黑格子'), tone: s.passed ? 'ok' : 'warn' },
      { icon: '🟩', label: '代码块点亮', value: Q.pctText(a.blocks.rate), sub: a.blocks.covered + ' / ' + a.blocks.total + ' 块已执行', tone: a.blocks.rate >= 100 ? 'ok' : 'blue' },
      { icon: '🔀', label: '岔路口真假枝', value: Q.pctText(a.decisions.rate), sub: a.decisions.covered + ' / ' + a.decisions.total + ' 条枝', tone: a.decisions.rate >= 100 ? 'ok' : 'teal' },
      { icon: '🧩', label: '原子条件覆盖', value: Q.pctText(a.conditions.rate), sub: a.conditions.covered + ' / ' + a.conditions.total + ' 项', tone: 'blue' }
    ]);

    /* 点击挑选用例电池板 */
    var pills = Q.WB_LIBRARY.map(function (c) {
      var on = (st.selectedIds || []).indexOf(c.id) >= 0;
      return '<button type="button" class="pill-btn' + (on ? ' on' : '') + '" data-act="wb-toggle" data-id="' + c.id + '">' +
        (on ? '💡 ' : '🔌 ') + c.id + ' · ' + Q.esc(c.short) + '</button>';
    }).join('');
    var bankCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🔋 点亮电路测试库（点击任意按钮通电 / 断电，看看哪盏暗灯亮了！）</span></div>' +
      '<span class="badge mute">已插 ' + res.runs.length + ' / ' + Q.WB_LIBRARY.length + ' 颗电池</span></div>' +
      '<div class="card-b"><div class="qf-pills">' + pills + '</div></div></div>';

    var stepNotice = stepRun
      ? '<div class="ball-drop-pill ok mt10"><span>⚡ 正在演示：' + Q.esc(stepRun.id + ' ' + stepRun.label) + ' → 刚刚点亮 ' + stepRun.blocks.length + ' 个电路节点（金黄高亮）</span></div>'
      : '<div class="tiny muted mt10">💡 绿块 = 已跑到的代码 · 灰色虚线块 = 从没跑过的代码盲区（比如 B16 负值截断试着点亮 <b>U9 1/1 券500</b> 看看！）</div>';

    var cfgCard = '<div class="card"><div class="card-h"><span class="card-t">💡 代码内部控制流电路图（揭开黑盒看程序怎么走）</span></div>' +
      '<div class="card-b"><div class="cfg-box">' + renderCfgSvg(res, stepRun) + stepNotice + '</div></div></div>';

    var coachBox = s.passed
      ? Q.coach('ok', '电路全亮达标！你用 ' + res.runs.length + ' 条用例就攻克了目标',
        '这就是白盒测试的精妙所在：<b>把代码内部所有分支和岔路口亮出来</b>，不浪费重复测试，专挑暗掉的角落（比如 B02 非法入口、B16 负数保护）精准补用例！')
      : Q.coach('warn', '还有黑灯没亮！目前只点亮了 ' + s.value + ' / ' + s.total + ' 处',
        '试试顺手点开 <b>U9 (券500负数保护)</b>、<b>U11 (0课时拦截)</b> 等黑灯泡，或者直接点击上面「⚡ 一键自动凑齐最少通关用例」看机器帮你挑出最省力气的一组！');

    var srcHtml = '<div class="codeview">' + a.parsed.lines.slice(0, 60).map(function (l) {
      var hit = l.block && a.hitBlocks[l.block];
      return '<div class="code-line ' + (l.kind === 'instr' ? 'instr' : (hit ? 'hit' : 'miss')) + '">' +
        '<span class="cl-no">' + l.no + '</span><span class="cl-tx">' + Q.esc(l.text || ' ') + '</span></div>';
    }).join('') + '</div>';

    return kpis + bankCard + cfgCard + coachBox +
      Q.drawer('🔬 展开带探针的真实被测源码（绿行=执行过 · 红行=从未跑到）', a.parsed.lines.length + ' 行', srcHtml, false);
  }

  function onAction(act, el, st, WB, update) {
    if (act === 'wb-toggle') {
      var id = el.getAttribute('data-id');
      var cur = (st.selectedIds || []).slice();
      var i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1); else cur.push(id);
      st.selectedIds = cur;
      st.stepIdx = -1;
      return true;
    }
    if (act === 'wb-default') {
      st.selectedIds = ['U1', 'U2', 'U3', 'U4'];
      st.stepIdx = -1;
      return true;
    }
    if (act === 'wb-minset') {
      var minRes = Q.wbGreedyMinSet(Q.WB_POOL, st.criterion, st.defects);
      var matchedIds = [];
      minRes.cases.forEach(function (inp) {
        var found = Q.WB_LIBRARY.find(function (lib) { return JSON.stringify(lib.input) === JSON.stringify(inp); });
        if (found) matchedIds.push(found.id);
      });
      st.selectedIds = matchedIds.length ? matchedIds : ['U1', 'U2', 'U5', 'U7', 'U9', 'U11'];
      st.stepIdx = -1;
      WB.toast('已为您自动挑出最少达标组合（仅需 ' + st.selectedIds.length + ' 条用例）！');
      return true;
    }
    if (act === 'wb-animate') {
      var total = (st.selectedIds || []).length;
      if (!total) { WB.toast('先在电池板里点亮至少 1 条用例哦', 'warn'); return; }
      if (WB.session.animTimer) clearInterval(WB.session.animTimer);
      st.stepIdx = 0;
      update(false);
      WB.session.animTimer = setInterval(function () {
        if (st.stepIdx + 1 >= total) {
          clearInterval(WB.session.animTimer);
          WB.session.animTimer = null;
          return;
        }
        st.stepIdx += 1;
        update(false);
      }, 550);
    }
  }

  function evidence(res) {
    var dRate = res.analysis.decisions.rate || 0;
    return {
      status: res.status.passed ? 'pass' : 'warn',
      pass: res.status.passed,
      coverage: dRate,
      label: '判定覆盖率',
      defects: res.runs.some(function (r) { return r.id === 'U9'; }) ? ['COUPON_CAP'] : [],
      summary: res.status.value + '/' + res.status.total + ' 达成准则，语句 ' + Q.pctText(res.analysis.blocks.rate) + ' / 判定 ' + Q.pctText(dRate),
      metrics: { blocks: res.analysis.blocks.rate, decisions: dRate }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢白盒与覆盖准则',
      '<b>把代码打开像查电路一样一行行点亮！</b>严苛程度排队：<b>块(语句)覆盖 &lt; 岔口(判定)覆盖 &lt; 原子条件覆盖 &lt; 判定-条件双满</b>。写最少测试用例点亮所有拐角就是高手！');
  }

  window.WB.registerExp({
    id: 'm6', no: 6, group: '状态、结构与流水线',
    title: '白盒电路 · 迷宫全亮', chapter: '第 4 章 · 白盒与覆盖分析',
    hook: '看清代码内部分支电路，选最少测试用例把它全点亮',
    goal: ['用亮灯图看清哪些代码从没被测过', '体会贪心最小集合怎样用最少的用例达标'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

/* ============================================================================
 * m7.js — 第 7 关：自动化质检流水线（CI/CD 传送带）
 * ==========================================================================*/
(function () {
  'use strict';
  var Q = window.QT;

  function makeDefaults() {
    return {
      version: 'v1.2-rc1',
      scope: 'all',
      modules: ['fee', 'app', 'fsm', 'form'],
      minPassRate: 100,
      maxFailures: 0,
      retries: 0,
      requireSmoke: true,
      requireAffected: true,
      pulseTick: 0
    };
  }

  function buildParams() {
    return [
      {
        key: 'version', label: '送进流水线的代码版本', type: 'pills', wide: true,
        options: [
          { v: 'v1.0', l: '🟢 v1.0 稳定健康版' },
          { v: 'v1.1', l: '🟡 v1.1 小缺陷版' },
          { v: 'v1.2-rc1', l: '🚨 v1.2-rc1 冒烟炸雷版' }
        ]
      },
      {
        key: 'scope', label: '跑多少测试（时间 vs 深度）', type: 'pills',
        options: [
          { v: 'all', l: '全套 15 关质检' },
          { v: 'smoke', l: '⚡ 仅冒烟快测' },
          { v: 'affected', l: '🎯 只测改过处' }
        ]
      },
      { type: 'action', action: 'run-pipe', label: '▶️ 重新发动传送带质检', variant: 'primary' },
      {
        key: 'modules', label: '参与测试的业务模块', type: 'checks', advanced: true,
        options: Q.RG_MODULES.map(function (m) { return { v: m.key, l: m.label }; })
      },
      { key: 'requireSmoke', label: '冒烟一票否决（只要核心挂立刻停）', type: 'checkbox', advanced: true },
      { key: 'requireAffected', label: '必测本次改过的模块', type: 'checkbox', advanced: true },
      { key: 'minPassRate', label: '最低通过率红线 (%)', type: 'range', min: 70, max: 100, step: 5, unit: '%', advanced: true },
      { key: 'maxFailures', label: '最多容忍几条失败', type: 'range', min: 0, max: 5, step: 1, unit: ' 条', advanced: true }
    ];
  }

  function compute(st, WB) {
    var r = Q.rgRun({
      version: st.version, scope: st.scope, modules: st.modules,
      minPassRate: st.minPassRate, maxFailures: st.maxFailures,
      retries: st.retries, requireSmoke: st.requireSmoke, requireAffected: st.requireAffected
    });
    var pipe = Q.rgPipeline(st, r, WB && WB.evidence ? WB.evidence.m1 : null);
    return { r: r, pipe: pipe };
  }

  function viz(res, st) {
    var r = res.r;
    var kpis = Q.kpiStrip([
      { icon: r.gatePassed ? '🟢' : '🔴', label: '流水线最终落闸', value: r.gatePassed ? '绿灯放行' : '红灯拦下', sub: r.gatePassed ? '全部门槛亮绿通过' : '不修好禁止上线！', tone: r.gatePassed ? 'ok' : 'bad' },
      { icon: '📊', label: '回归测试通过率', value: Q.pctText(r.passRate), sub: r.passed + ' / ' + r.results.length + ' 条跑过', tone: r.failed === 0 && !r.empty ? 'ok' : 'warn' },
      { icon: '💥', label: '踩雷失败用例', value: r.failed + ' 条', sub: r.empty ? '警告：没有选任何测试' : '点击下面看具体哪条炸了', tone: r.failed ? 'bad' : 'ok' },
      { icon: '🎯', label: '改动波及模块', value: r.affected.length ? r.affected.join(', ') : '全部稳定', sub: '改哪测哪防漏网', tone: 'blue' }
    ]);

    var pipeIcons = { checkout: '📥', static: '🔍', regression: '🧪', gate: '🚦' };
    var pipeCard = '<div class="card"><div class="card-h">' +
      '<div><span class="card-t">🏭 自动化质检传送带（第 ' + (st.pulseTick + 1) + ' 次运行）</span></div>' +
      '<span class="badge ' + (r.gatePassed ? 'pass' : 'fail') + '">' + (r.gatePassed ? '✅ 全线顺畅' : '🚧 流水线阻断') + '</span></div>' +
      '<div class="card-b"><div class="pipe">' +
      res.pipe.map(function (p, i) {
        var cls = p.skipped ? 'skip' : (p.ok ? 'ok' : 'bad');
        return '<div class="pipe-step ' + cls + '">' +
          '<div class="ps-n">第 ' + (i + 1) + ' 站 · ' + (pipeIcons[p.key] || '⚙️') + ' ' + Q.esc(p.name) + '</div>' +
          '<div class="ps-s">' + (p.skipped ? '⏭️ 跳过' : (p.ok ? '🟢 通过' : '🔴 红灯拦截')) + '</div>' +
          '<div class="ps-d">' + Q.esc(p.detail) + '</div>' +
        '</div>';
      }).join('') +
      '</div><div class="conveyor-belt"></div></div></div>';

    var checksHtml = '<div class="card"><div class="card-h"><span class="card-t">🚧 4 道红绿灯检验卡</span></div>' +
      '<div class="card-b">' + r.checks.map(function (c) {
        return '<div class="checkrow ' + (c.ok ? 'ok' : 'no') + '">' +
          '<span>' + (c.ok ? '✅' : '🚨') + '</span>' +
          '<div><b>' + Q.esc(c.label) + '</b> <span class="muted">· ' + Q.esc(c.detail) + '</span></div>' +
        '</div>';
      }).join('') + '</div></div>';

    var coachBox = r.empty
      ? Q.coach('bad', '警告：流水线啥也没测就想过关？门都没有！', '当用例数为 0 时，分母为 0 不能假装 100% 通过！请确保勾选了模块和合适的测试范围。')
      : (!r.gatePassed
        ? Q.coach('bad', '红灯警报！就算通过率有 ' + Q.pctText(r.passRate) + ' 也不能发布！',
          '别被“超过90%通过”骗了！核心<b>冒烟测试（Smoke）一旦挂掉</b>或改动的计费模块报错，老功能都算炸了，流水线必须一票否决直接亮红灯栏杆！试试切换到 <b>v1.0 稳定健康版</b> 对比绿灯通行。')
        : Q.coach('ok', '全线绿灯通过！放心进入下一关质量发布决策',
          '所有模块（包含核心冒烟与受改动影响的区域）100% 全绿，自动化流水线成功充当了你的全天候“上线门神”！'));

    var resRows = r.results.map(function (x) {
      return [
        { html: '<span class="mono">' + Q.esc(x.id) + '</span>' },
        x.name,
        { html: x.smoke ? Q.badge('warn', '核心冒烟') : Q.badge('mute', x.module) },
        { html: x.pass ? Q.badge('pass', '✅ 通过') : Q.badge('fail', '💥 失败') },
        x.pass ? '正常符合预期' : { html: '<span style="color:#b91c1c">' + Q.esc((x.diffs || []).join('；')) + '</span>' }
      ];
    });

    return kpis + pipeCard + checksHtml + coachBox +
      Q.drawer('📋 查看 ' + r.results.length + ' 条自动测试明细清单', r.failed + ' 条失败', Q.table(['编号', '用例说明', '标签', '结果', '抓到的异常'], resRows), false);
  }

  function onAction(act, el, st, WB) {
    if (act === 'run-pipe') {
      st.pulseTick = (st.pulseTick || 0) + 1;
      WB.toast('流水线传送带已重新质检一轮！');
      return true;
    }
  }

  function evidence(res) {
    var r = res.r;
    return {
      status: r.gatePassed ? 'pass' : 'fail',
      pass: r.gatePassed,
      coverage: r.passRate || 0,
      label: '回归通过率',
      defects: r.failed > 0 ? ['SEAT_BOUNDARY'] : [],
      summary: r.version + ' 通过 ' + r.passed + '/' + r.results.length + '（' + (r.gatePassed ? '绿灯放行' : '红灯拦停') + '）',
      metrics: { passRate: r.passRate, failed: r.failed }
    };
  }

  function theory() {
    return Q.coach('info', '一句话记牢自动化回归流水线',
      '<b>每次改完代码就让机器人把老功能快速全重测一遍！</b>记住两招省时防漏诀窍：<b>冒烟快测</b>一挂立刻叫停（一票否决），再重点跑<b>受本次改动波及的模块</b>！');
  }

  window.WB.registerExp({
    id: 'm7', no: 7, group: '状态、结构与流水线',
    title: '质检流水线 · CI 传送带', chapter: '第 8 章 · 自动化与回归测试',
    hook: '提交代码自动过四关：哪怕93%通过，核心冒烟挂了也要拦',
    goal: ['理解“回归通过率高不代表能发布”的一票否决逻辑', '对比空用例集、稳定版与带雷版的流水线红绿灯切换'],
    defaults: makeDefaults(), params: buildParams,
    compute: compute, viz: viz, onAction: onAction, evidence: evidence, theory: theory
  });
})();

      { key: 'budget', label: '发版前只剩多少修复工时', type: 'range', min: 0, max: 40, step: 2, unit: ' 工时', wide: true },
